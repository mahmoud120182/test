<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>القرآن الكريم - القراءة والاستماع</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
              950: '#022c22'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 font-['Cairo',sans-serif] h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <!-- Sidebar Toggle Button for Mobile -->
      <button id="toggle-sidebar" class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 focus:outline-none" aria-label="قائمة السور">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>

      <div class="bg-emerald-500/10 p-2 rounded-xl text-emerald-400 border border-emerald-500/20">
        <i data-lucide="book-open" class="w-6 h-6"></i>
      </div>
      <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
        القرآن الكريم
      </h1>
    </div>

    <!-- Global Actions -->
    <div class="flex items-center gap-2">
      <div class="relative hidden sm:block w-48 md:w-60">
        <i data-lucide="search" class="absolute right-3 top-2.5 w-4 h-4 text-slate-400"></i>
        <input
          id="search-input"
          type="text"
          placeholder="ابحث عن سورة..."
          class="w-full bg-slate-800 border border-slate-700 text-sm rounded-lg pr-9 pl-4 py-2 focus:outline-none focus:border-emerald-500 text-slate-200"
        />
      </div>

      <button id="toggle-translation" title="تبديل الترجمة" class="p-2 rounded-lg border border-slate-800 text-slate-400 hover:bg-slate-800 text-xs font-bold flex items-center gap-1">
        <i data-lucide="languages" class="w-4 h-4"></i>
        <span>EN</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar Overlay / Backdrop (Mobile Only) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/70 z-40 lg:hidden hidden transition-opacity duration-300"></div>

    <!-- Sidebar: Auto-hiding Drawer on Mobile / Fixed Panel on Large Screens -->
    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-72 sm:w-80 bg-slate-900 border-l border-slate-800 flex flex-col transform translate-x-full lg:translate-x-0 lg:static lg:z-auto transition-transform duration-300 ease-in-out shrink-0">
      
      <!-- Drawer Mobile Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between lg:hidden">
        <span class="font-bold text-slate-200">فهرس السور</span>
        <button id="close-sidebar" class="p-1 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-800 sm:hidden">
        <div class="relative">
          <i data-lucide="search" class="absolute right-3 top-2.5 w-4 h-4 text-slate-400"></i>
          <input
            id="mobile-search-input"
            type="text"
            placeholder="ابحث عن سورة..."
            class="w-full bg-slate-800 border border-slate-700 text-sm rounded-lg pr-9 pl-4 py-2 text-slate-200"
          />
        </div>
      </div>

      <div id="surahs-list" class="overflow-y-auto flex-1 divide-y divide-slate-800/50 custom-scrollbar">
        <!-- Dynamic Surahs loaded via JavaScript -->
      </div>
    </aside>

    <!-- Main Quran Display -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 md:p-8 space-y-6 pb-36 md:pb-28 custom-scrollbar" id="quran-container">
      
      <!-- Surah Header Banner -->
      <div class="relative overflow-hidden bg-gradient-to-br from-emerald-900/40 via-slate-800/50 to-slate-900 border border-emerald-500/20 rounded-2xl p-4 sm:p-8 text-center shadow-xl">
        <h2 id="current-surah-title" class="font-serif text-3xl sm:text-4xl md:text-5xl font-bold text-emerald-400 mb-2">
          جاري التحميل...
        </h2>
        <p id="current-surah-info" class="text-slate-400 text-xs sm:text-sm"></p>
        <div id="bismillah" class="font-serif text-xl sm:text-2xl text-emerald-300/80 mt-4 sm:mt-6 pt-4 sm:pt-6 border-t border-slate-700/50 hidden">
          بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ
        </div>
      </div>

      <!-- Ayahs Container -->
      <div id="ayahs-container" class="space-y-4">
        <!-- Dynamic Ayahs rendered here -->
      </div>
    </main>
  </div>

  <!-- Sticky Audio Player Footer -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-4 py-3 shadow-2xl">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
      
      <!-- Reciter Selector & Info -->
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center gap-3">
          <div class="bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20 text-emerald-400 hidden sm:block">
            <i data-lucide="mic" class="w-5 h-5"></i>
          </div>
          <select id="reciter-select" class="bg-slate-800 text-xs md:text-sm text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-emerald-500 max-w-[200px] sm:max-w-xs truncate">
            <!-- Loaded dynamically from app.js -->
          </select>
        </div>
        <div id="audio-info" class="text-xs text-slate-400 truncate sm:block">اختر سورة للبدء</div>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-center gap-6 w-full sm:w-auto">
        <button id="prev-btn" class="text-slate-400 hover:text-slate-200 transition p-1">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>

        <button id="play-btn" class="w-11 h-11 bg-emerald-500 text-slate-950 rounded-full flex items-center justify-center shadow-lg hover:bg-emerald-400 transition shrink-0">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>

        <button id="next-btn" class="text-slate-400 hover:text-slate-200 transition p-1">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
      </div>

    </div>
  </footer>

  <!-- Tafsir Modal -->
  <div id="tafsir-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-5 sm:p-6 shadow-2xl max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <h3 id="tafsir-title" class="font-bold text-emerald-400 text-lg">تفسير الآية</h3>
        <button id="close-tafsir" class="text-slate-400 hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="tafsir-content" class="text-slate-300 leading-relaxed overflow-y-auto text-sm sm:text-base">
        جاري تحميل التفسير...
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
