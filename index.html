<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>القرآن الكريم - التلاوة والتفسير</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<script>
  (function () {
    const apply = function () {
      const t = localStorage.getItem('app_theme') || 'dark';
      document.documentElement.classList.toggle('theme-light', t === 'light');
    };
    apply();
    // إعادة التطبيق عند العودة من صفحة أخرى (bfcache)
    window.addEventListener('pageshow', apply);
  })();
</script>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
    }
    .font-quran {
      font-family: 'Amiri', serif;
    }

    select option {
      background-color: #1e293b !important;
      color: #f1f5f9 !important;
      padding: 6px;
    }
    select option:checked {
      background-color: #10b981 !important;
      color: #020617 !important;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(51,65,85,0.85); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(16,185,129,0.55); }

    select {
      color: #f1f5f9;
    }

    #active-downloads-panel button {
      touch-action: manipulation;
    }

    /* ============ Light theme overrides ============ */
    html.theme-light body {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }
    html.theme-light header {
      background-color: rgba(255, 255, 255, 0.92) !important;
      border-color: #cbd5e1 !important;
    }
    html.theme-light footer {
      background-color: rgba(255, 255, 255, 0.96) !important;
      border-color: #cbd5e1 !important;
    }
    html.theme-light [class*="bg-slate-950"] { background-color: #f1f5f9 !important; }
    html.theme-light [class*="bg-slate-900"] { background-color: #ffffff !important; }
    html.theme-light [class*="bg-slate-800"] { background-color: #f1f5f9 !important; }
    html.theme-light [class*="bg-emerald-950"] { background-color: rgba(16, 185, 129, 0.12) !important; }

    html.theme-light [class*="text-slate-100"],
    html.theme-light [class*="text-slate-200"],
    html.theme-light [class*="text-slate-300"] { color: #0f172a !important; }
    html.theme-light [class*="text-slate-400"] { color: #475569 !important; }
    html.theme-light [class*="text-slate-500"] { color: #64748b !important; }

    html.theme-light [class*="border-slate-800"],
    html.theme-light [class*="border-slate-700"],
    html.theme-light [class*="border-slate-600"] { border-color: #cbd5e1 !important; }

    html.theme-light select { color: #0f172a !important; }
    html.theme-light select option {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="toggle-sidebar" class="lg:hidden p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-emerald-400 transition" aria-label="القائمة">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
            ق
          </div>
          <span class="font-bold text-lg tracking-wide bg-gradient-to-l from-emerald-400 to-teal-200 bg-clip-text text-transparent">القرآن الكريم</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 bg-slate-800/60 border border-slate-700/60 rounded-xl px-3 py-1.5">
          <i data-lucide="mic" class="w-4 h-4 text-emerald-400"></i>
          <select id="reciter-select" class="bg-transparent text-slate-200 text-sm focus:outline-none cursor-pointer">
          </select>
        </div>

        <button onclick="window.location.href='settings.html'" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 text-slate-300 hover:text-emerald-400 transition shadow-sm" title="الإعدادات وإدارة التخزين">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex relative overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 z-30 w-80 bg-slate-900 border-l border-slate-800 transform translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="book-open" class="w-4 h-4 text-emerald-400"></i> فهرس السور
        </h2>
        <button id="close-sidebar" class="lg:hidden p-1.5 rounded-lg hover:bg-slate-800 text-slate-400" aria-label="إغلاق">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-800/60">
        <div class="relative">
          <i data-lucide="search" class="absolute right-3 top-2.5 w-4 h-4 text-slate-500"></i>
          <input id="search-input" type="text" placeholder="ابحث عن سورة..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pr-9 pl-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition">
        </div>
      </div>

      <div id="surahs-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/40"></div>
    </aside>

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/80 z-20 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-950 pb-32">

      <!-- ======== قسم التنزيلات النشطة (داخل الصفحة) ======== -->
      <section id="active-downloads-panel" class="hidden bg-slate-900/50 border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm sm:text-base">
              <i data-lucide="download-cloud" class="w-4 h-4 sm:w-5 sm:h-5"></i>
              التنزيلات النشطة (<span id="active-downloads-count">0</span>)
            </div>
            <button id="active-downloads-toggle" type="button" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition" title="طي / عرض">
              <i data-lucide="chevron-down" class="w-4 h-4 transition-transform" id="active-downloads-toggle-icon"></i>
            </button>
          </div>
          <div id="active-downloads-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>
      </section>

      <!-- Surah Header Banner -->
      <div class="bg-gradient-to-b from-slate-900 to-slate-950 border-b border-slate-800/80 p-6 text-center relative">
        <h1 id="current-surah-title" class="text-3xl font-bold font-quran text-emerald-400 mb-2">الفاتحة</h1>
        <p id="current-surah-info" class="text-sm text-slate-400"></p>
      </div>

      <!-- Bismillah Banner -->
      <div id="bismillah" class="my-6 text-center font-quran text-2xl text-emerald-300/90 hidden">
        بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
      </div>

      <!-- Ayahs Container -->
      <div id="ayahs-container" class="max-w-4xl w-full mx-auto px-4 sm:px-6 space-y-4 pt-4"></div>

    </main>
  </div>

  <!-- Audio Player Fixed Bottom Bar -->
  <footer class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 shadow-2xl py-3 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 truncate">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shrink-0">
          <i data-lucide="headphones" class="w-5 h-5"></i>
        </div>
        <div class="truncate">
          <div id="audio-info" class="text-sm font-bold text-slate-200 truncate">اختر سورة للبدء</div>
          <div class="text-xs text-slate-400">التلاوة مستمرة أونلاين وأوفلاين</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="prev-btn" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-emerald-400 transition" title="الآية السابقة">
          <i data-lucide="skip-forward" class="w-5 h-5"></i>
        </button>
        <button id="play-btn" class="w-12 h-12 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center transition shadow-lg shadow-emerald-500/20" title="تشغيل / إيقاف">
          <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
        <button id="next-btn" class="p-2.5 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-emerald-400 transition" title="الآية التالية">
          <i data-lucide="skip-back" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </footer>

  <!-- Tafsir Modal -->
  <div id="tafsir-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-emerald-400 flex items-center gap-2">
          <i data-lucide="book-open" class="w-5 h-5"></i> التفسير الميسر
        </h3>
        <button id="close-tafsir" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="tafsir-content" class="text-slate-200 text-base leading-relaxed font-quran p-2">
        جاري التحميل...
      </div>
    </div>
  </div>

  <script src="bulk-downloader.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const savedFontSize = localStorage.getItem('quran_font_size') || 'text-3xl';
      window.applySavedFontSize = (el) => {
        el.className = `font-quran ${savedFontSize} leading-loose text-slate-100 text-right mb-4`;
      };
    });
  </script>
</body>
</html>
