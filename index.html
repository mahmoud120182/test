<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض رسوماتي | فنان تشكيلي</title>
    <!-- استيراد خط عربي أنيق من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #121212;
            color: #f1f1f1;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1f1f1f, #2d2d2d);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid #ff7300;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff7300;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
        }
        p.bio {
            font-size: 1.1rem;
            color: #aaa;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #ff7300;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .art-card {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .art-card:hover {
            transform: translateY(-5px);
        }
        .art-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .art-info {
            padding: 15px;
            text-align: center;
        }
        .art-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #181818;
            color: #777;
            margin-top: 50px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- الهيدر الشخصي -->
    <header>
        <!-- ضع صورتك الشخصية في نفس المجلد وسمها my-photo.jpg -->
        <img src="zizo.jpg" alt="صورتي الشخصية" class="profile-img">
        <h1>أهلاً بكم في عالمي الفني</h1>
        <p class="bio">أنا فنان أعشق الرسم والتعبير بالألوان. أبلغ من العمر 16 عاماً وأسعى لتطوير موهبتي ومشاركة أعمالي معكم.</p>
    </header>

    <!-- معرض الأعمال -->
    <div class="container">
        <h2>معرض الرسومات</h2>
        <div class="gallery">
            <!-- الرسمة الأولى -->
            <div class="art-card">
                <img src="art1.jpg" alt="رسمة 1">
                <div class="art-info">
                    <h3>عنوان اللوحة الأولى</h3>
                </div>
            </div>
            <!-- الرسمة الثانية -->
            <div class="art-card">
                <img src="art2.jpg" alt="رسمة 2">
                <div class="art-info">
                    <h3>عنوان اللوحة الثانية</h3>
                </div>
            </div>
            <!-- الرسمة الثالثة -->
            <div class="art-card">
                <img src="art3.jpg" alt="رسمة 3">
                <div class="art-info">
                    <h3>عنوان اللوحة الثالثة</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- التذييل -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 | تصميم موقع فنان شاب</p>
    </footer>

</body>
</html>
